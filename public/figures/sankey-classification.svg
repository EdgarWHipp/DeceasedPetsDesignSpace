<text x="54" y="90" font-family="Helvetica" font-size="15" fill="#5C6663">Ten concept cards, five to nine raters each, nine dimensions per card. 630 cells, each drawn exactly once. Key match figures reproduce analysis/reproduce_results.py.</text>
<text x="54" y="111" font-family="Helvetica" font-size="15" fill="#5C6663">“Cannot tell” was ticked in 78 cells; on 2 of them the archived key accepts it, so those 2 are drawn as matches and this node reads 76. “Does not apply” was ticked in 19, of which 9 are on the card where it is the intended answer.</text>
