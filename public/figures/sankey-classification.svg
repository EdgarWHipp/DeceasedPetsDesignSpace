<text x="40" y="104" font-family="Helvetica" font-size="19" fill="#5C6663">Each card was placed on all nine dimensions by five to nine people. Every placement is traced here, from the card to where it landed.</text>
<text x="40" y="132" font-family="Helvetica" font-size="19" fill="#5C6663">“Cannot tell” and “Does not apply” were offered alongside the codes, so a reader could decline a dimension instead of forcing it.</text>
