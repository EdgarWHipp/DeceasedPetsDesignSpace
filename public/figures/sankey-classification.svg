<text x="46" y="80" font-family="Helvetica" font-size="37" font-weight="800" fill="#252827">Ten concepts, read through the space</text>
<text x="46" y="120" font-family="Helvetica" font-size="22" fill="#5C6663">Each card was placed on all nine dimensions by five to nine people. Every placement is traced here, from the card to where it landed.</text>
<text x="46" y="152" font-family="Helvetica" font-size="22" fill="#5C6663">“Cannot tell” and “Does not apply” were offered alongside the codes, so a reader could decline a dimension instead of forcing it.</text>
